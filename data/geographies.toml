# Geography register (ADR-0014). Every area type the project uses, with its vintage.
# Identity is GSS code + vintage; names are display only. Add a layer here before using it.

[[layer]]
id = "PCON2024"
description = "Westminster parliamentary constituencies, 2023 review"
gss_prefixes = ["E14", "S14", "W07", "N05"]
drawn_by = ["Boundary Commission for England", "Boundary Commission for Scotland", "Boundary Commission for Wales", "Boundary Commission for Northern Ireland"]
valid_from = "2024-05-31"
source = "pcon2024_boundaries"
profiles = ["commons"]

[[layer]]
id = "WD20240704"
description = "Electoral wards and divisions as at the GE2024 polling day"
gss_prefixes = ["E05", "W05", "S13", "N08"]
drawn_by = ["Local Government Boundary Commission for England", "Democracy and Boundary Commission Cymru", "Boundary Scotland", "Local Government Boundaries Commissioner for Northern Ireland"]
valid_from = "2024-07-04"
source = "wd24_pcon24_lad24_lookup"
profiles = ["commons"]

[[layer]]
id = "LAD20240704"
description = "Local authority districts as at the GE2024 polling day (G3 vintage, ADR-0014)"
gss_prefixes = ["E06", "E07", "E08", "E09", "W06", "S12", "N09"]
drawn_by = ["Parliament and devolved legislatures (local government structure orders)"]
valid_from = "2024-07-04"
source = "wd24_pcon24_lad24_lookup"
profiles = ["commons"]

[[layer]]
id = "SENC2026"
description = "Senedd Cymru constituencies, May 2026 (16, each pairing two Westminster seats)"
gss_prefixes = ["W09"]
drawn_by = ["Democracy and Boundary Commission Cymru"]
valid_from = "2026-05-07"
source = "senc2026_names_codes"
profiles = ["devolved"]

[[layer]]
id = "SPC2021"
description = "Scottish Parliament constituencies at the 2021 election (73; 2011 boundaries, ONS December 2020 codes)"
gss_prefixes = ["S16"]
drawn_by = ["Boundary Commission for Scotland"]
valid_from = "2011-05-05"
valid_to = "2026-05-06"
source = "spc2021_spr2021_lookup"
profiles = ["devolved"]

[[layer]]
id = "SPR2021"
description = "Scottish Parliament electoral regions at the 2021 election (8 regions of 7 list seats)"
gss_prefixes = ["S17"]
drawn_by = ["Boundary Commission for Scotland"]
valid_from = "2011-05-05"
valid_to = "2026-05-06"
source = "spc2021_spr2021_lookup"
profiles = ["devolved"]

[[layer]]
id = "WD2022S"
description = "Scottish council wards at the 2022-05-05 elections (355 wards of 1-5 members, ONS May 2022 codes)"
gss_prefixes = ["S13"]
drawn_by = ["Local Government Boundary Commission for Scotland"]
valid_from = "2022-05-05"
source = "wd2022_lad2022_lookup"
profiles = ["council"]

[[layer]]
id = "LAD2022S"
description = "Scottish council areas at the 2022-05-05 elections (32, ONS May 2022 codes)"
gss_prefixes = ["S12"]
drawn_by = ["Local Government Boundary Commission for Scotland"]
valid_from = "2022-05-05"
source = "wd2022_lad2022_lookup"
profiles = ["council"]

