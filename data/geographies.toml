# Geography register (ADR-0014). Every area type the project uses, with its vintage.
# Identity is GSS code + vintage; names are display only. Add a layer here before using it.

[[layer]]
id = "PCON2024"
description = "Westminster parliamentary constituencies, 2023 review"
gss_prefixes = ["E14", "S14", "W07", "N05"]
drawn_by = ["Boundary Commission for England", "Boundary Commission for Scotland", "Boundary Commission for Wales", "Boundary Commission for Northern Ireland"]
valid_from = "2024-05-31"
source = "pcon2024_boundaries"
profiles = ["commons"]

