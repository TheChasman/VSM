[project]
name = "vsm-py"
version = "0.1.0"
description = "Python stages (ingest, geography, preferences) for Voting System Metrics"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.27",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[project.scripts]
vsm-ingest = "vsm_py.ingest.cli:main"
vsm-geography = "vsm_py.geography.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vsm_py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
